<html lang="en"><head><meta charset="utf-8"><title>LifeLink — Emergency Blood Donor Matching Network</title>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--red:#D7263D;--navy:#101828;--amb:#F59E0B;--grn:#16A34A;--bg:#F8FAFC;--card:#fff;--tx:#101828;--mut:#5B6678;--bd:#E4E8EF;--sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.12);--soft:#FDECEF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--card:#131C2E;--tx:#F1F5F9;--mut:#9AA6BA;--bd:#233049;--soft:#2A1620;--red:#F0445A}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.12}h1{font-size:clamp(34px,5.4vw,60px);font-weight:800}h2{font-size:clamp(26px,3.4vw,38px);font-weight:800}h3{font-size:17px;font-weight:700}p{margin:0}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}.sec{padding:72px 0}.mut{color:var(--mut)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
nav .wrap{display:flex;align-items:center;gap:20px;height:64px}.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.03em}
.menu{display:flex;gap:4px;margin-left:12px;flex:1}.menu a{padding:8px 11px;border-radius:9px;color:var(--mut);font-size:14px;font-weight:600}.menu a:hover,.menu a.on{background:var(--soft);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;border:1px solid var(--bd);background:var(--card);font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.n{background:var(--navy);border-color:var(--navy);color:#fff}.btn.g{background:var(--grn);border-color:var(--grn);color:#fff}.btn.sm{padding:7px 12px;font-size:13px}.btn.lg{padding:16px 24px;font-size:17px;border-radius:14px}
.burger{display:none}.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:22px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--red)}.badge.a{background:#FEF3C7;color:#92400E}.badge.g{background:#DCFCE7;color:#166534}.badge.b{background:#DBEAFE;color:#1D4ED8}.badge.x{background:#EEF0F4;color:#475066}
.bg{display:inline-grid;place-items:center;min-width:40px;height:40px;border-radius:12px;color:#fff;font-weight:800}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--red);transition:width .6s}
.hero{padding:56px 0 64px;background:radial-gradient(900px 420px at 80% 0,var(--soft),transparent)}.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero p.lead{font-size:19px;color:var(--mut);margin:18px 0 26px;max-width:520px}.ctas{display:flex;gap:12px;flex-wrap:wrap}.trust{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.trust span,.trust a{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:700;padding:8px 12px;border:1px solid var(--bd);border-radius:99px;background:var(--card)}.trust a{transition:.15s}.trust a:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px)}
.strip{background:var(--navy);color:#fff}.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:34px 20px}.strip b{display:block;font-size:38px;font-weight:800;letter-spacing:-.03em}.strip span{color:#AEB8CC;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin-top:36px}.steps:before{content:"";position:absolute;left:12%;right:12%;top:26px;height:3px;background:repeating-linear-gradient(90deg,var(--red) 0 10px,transparent 10px 18px)}
.step{text-align:center;padding:0 12px;position:relative}.step i{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-weight:800;margin:0 auto 14px;box-shadow:0 0 0 6px var(--bg)}
.ic{width:46px;height:46px;border-radius:13px;background:var(--soft);color:var(--red);display:grid;place-items:center;margin-bottom:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}.phone{width:290px;margin:0 auto;border-radius:38px;background:var(--navy);padding:10px;box-shadow:0 30px 60px -20px rgba(16,24,40,.5)}.phone>div{background:var(--card);border-radius:30px;overflow:hidden}
.phone .top{background:var(--red);color:#fff;padding:22px 18px;font-weight:800}.phone .bd{padding:18px;display:grid;gap:12px}
.pulse{animation:pl 1.6s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(215,38,61,.5)}100%{box-shadow:0 0 0 22px rgba(215,38,61,0)}}
.foot{background:var(--navy);color:#C9D1E0;padding:48px 0 32px;margin-top:40px}.foot a{display:block;padding:3px 0}
.page{padding:36px 0 80px;animation:in .25s}@keyframes in{from{opacity:.4}}
.fld{display:grid;gap:6px;margin-bottom:14px}.fld label{font-weight:700;font-size:13px}.fld input,.fld select,.fld textarea{padding:12px 13px;border:1.5px solid var(--bd);border-radius:11px;background:var(--card);width:100%}.fld input:focus,.fld select:focus{border-color:var(--red);outline:0}.fld .er{color:var(--red);font-size:12px;min-height:0}.fld.bad input,.fld.bad select{border-color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{cursor:pointer;padding:9px 14px;border-radius:11px;border:2px solid var(--bd);font-weight:800;background:var(--card)}.chip.on{color:#fff;border-color:transparent}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}
.split-login{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 64px)}.split-login .l{background:linear-gradient(160deg,#101828,#3A0F1A 70%,#D7263D);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:18px}.split-login .r{display:grid;place-items:center;padding:30px}
.tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}.tabs a{padding:9px 14px;border-radius:10px;font-weight:700;color:var(--mut);border:1px solid var(--bd);background:var(--card)}.tabs a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpi b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em}.kpi span{color:var(--mut);font-size:13px}
.sk{background:linear-gradient(90deg,var(--bd),var(--card),var(--bd));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px;height:120px}@keyframes sh{to{background-position:-200% 0}}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;font-size:12px;color:var(--mut)}.stat b{display:block;font-size:20px;color:var(--tx)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mut);font-size:12px}.sc{overflow-x:auto}
.ccbar{background:var(--navy);color:#fff;padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}.ccbar small{color:#AEB8CC;display:block;font-size:11px}.ccbar b{font-size:15px}
.cc{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;padding:16px;align-items:start}.map{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--bd);background:#E7EEE9}#lmap>svg{display:block;width:100%;height:auto}#lmap{height:470px;background:#E8EFEA;z-index:0}.leaflet-container{font:inherit}
.pop{z-index:500;position:absolute;left:14px;bottom:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh);width:230px;font-size:13px}
.leg{z-index:500;position:absolute;right:12px;top:12px;background:color-mix(in srgb,var(--card) 90%,transparent);border-radius:12px;padding:10px 12px;font-size:12px;display:grid;gap:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.dr{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.dr:last-child{border:0}
.tl{border-left:3px solid var(--bd);margin-left:6px;padding-left:16px;display:grid;gap:12px}.tl div{position:relative;font-size:14px}.tl div:before{content:"";position:absolute;left:-23px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--red)}
.ov{position:fixed;inset:0;background:rgba(16,24,40,.55);display:grid;place-items:center;z-index:50;padding:20px}.ov .card{max-width:420px;width:100%}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60}.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;border-left:5px solid var(--grn);box-shadow:var(--sh);animation:in .2s}
.empty{text-align:center;padding:30px;color:var(--mut)}.ring{position:relative;width:130px;height:130px}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800}
.heat{display:grid;grid-template-columns:90px repeat(4,1fr);gap:4px;font-size:12px;text-align:center}.heat div{padding:8px 0;border-radius:6px}
.alertpg{max-width:460px;margin:0 auto}.alertpg .top{background:var(--red);color:#fff;text-align:center;padding:34px 20px 54px;border-radius:0 0 34px 34px}
.cmp td b{display:inline-block;margin:2px;padding:2px 9px;border-radius:8px;color:#fff;font-size:13px}
@media(max-width:900px){.menu,.nav-cta{display:none}.menu.open{display:grid;position:absolute;top:64px;left:0;right:0;background:var(--card);padding:12px;border-bottom:1px solid var(--bd)}.burger{display:inline-flex;margin-left:auto}.hero .wrap,.split,.cc,.split-login{grid-template-columns:1fr}.g3,.g4,.steps{grid-template-columns:1fr 1fr}.strip .wrap{grid-template-columns:1fr 1fr}.steps:before{display:none}.split-login .l{padding:32px}.g2{grid-template-columns:1fr}.sec{padding:48px 0}}
@media(max-width:560px){.g3,.g4,.steps{grid-template-columns:1fr}.heat{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="nav"></div><main id="app"></main><div id="toasts" aria-live="polite"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={drop:'M12 2.5s6.5 7 6.5 12a6.5 6.5 0 0 1-13 0c0-5 6.5-12 6.5-12z',pin:'M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',bell:'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0',check:'M5 12.5l4.5 4.5L19 7',x:'M6 6l12 12M18 6L6 18',pulse:'M3 12h4l2.5-6 4 12 2.5-6H21',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',clock:'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z',phone:'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',users:'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM21 20v-2a4 4 0 0 0-3-3.9',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',bolt:'M13 2L4 14h7l-1 8 9-12h-7z',map:'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14'};
const ic=(n,s=20,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const logo=`<span class="logo"><svg width="32" height="32" viewBox="0 0 32 32"><path d="M16 2s11 11.5 11 19a11 11 0 0 1-22 0C5 13.500 16 2 16 2z" fill="#D7263D"/><path d="M8.500 19h4l2-4.500 3 8 2-3.500h4" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg>LifeLink</span>`;
const G=['A+','A-','B+','B-','O+','O-','AB+','AB-'],GC={'A+':'#2563EB','A-':'#7C3AED','B+':'#0891B2','B-':'#0D9488','O+':'#C2610C','O-':'#D7263D','AB+':'#DB2777','AB-':'#6D28D9'};
const COMP={'O-':['O-'],'O+':['O+','O-'],'A-':['A-','O-'],'A+':['A+','A-','O+','O-'],'B-':['B-','O-'],'B+':['B+','B-','O+','O-'],'AB-':['AB-','A-','B-','O-'],'AB+':['AB+','AB-','A+','A-','B+','B-','O+','O-']};
const RARE=['AB-','B-','A-','O-'];
const gb=g=>`<span class="bg" style="background:${GC[g]}">${g}</span>`;
const D=[['Rahul Verma','O-',1.2,92,'A','Arera Colony'],['Priya Sharma','O-',2.1,88,'A','MP Nagar'],['Imran Khan','O-',3.4,81,'A','Kolar Road'],['Anjali Mehta','O-',4.8,76,'B','Shahpura'],['Vikram Singh','AB-',2.9,90,'A','TT Nagar'],['Sneha Patil','AB-',6.2,79,'A','Bairagarh'],['Arjun Nair','A-',3.8,84,'A','Arera Colony'],['Kavya Reddy','A-',7.1,70,'A','Hoshangabad Rd'],['Rohan Gupta','B-',5,83,'A','Jahangirabad'],['Neha Joshi','B-',9.4,66,'B','Berasia Rd'],['Aman Tiwari','B+',1.8,89,'A','Habibganj'],['Pooja Yadav','B+',4.1,77,'A','Govindpura'],['Sameer Ali','B+',8.8,68,'U','Piplani'],['Deepak Rao','O+',2.6,86,'A','Shyamla Hills'],['Ritu Jain','O+',5.7,80,'A','Ashoka Garden'],['Karan Malhotra','O+',11.2,61,'A','Misrod'],['Meera Iyer','A+',3.3,85,'A','Bittan Market'],['Sanjay Dubey','A+',6.9,72,'A','Kolar Road'],['Farah Siddiqui','AB+',4.4,78,'A','Old City'],['Harsh Pandey','O+',12.5,58,'B','Bhel']].map((d,i)=>({id:i,name:d[0],g:d[1],km:d[2],sc:d[3],av:d[4],area:d[5],ang:i*2.399}));
const AV={A:'Available',B:'Busy',U:'Unavailable'};
const REQS=[{id:'LL-2041',g:'O-',units:3,urg:'CRITICAL',radius:5,ctx:'Accident / trauma',mins:6},{id:'LL-2040',g:'B+',units:2,urg:'URGENT',radius:10,ctx:'Surgery',mins:38},{id:'LL-2039',g:'AB-',units:1,urg:'URGENT',radius:15,ctx:'Rare blood request',mins:74}];
const S={req:null,d:[],log:[],t0:0,status:'',sel:null,user:{name:'Aarav'},hmode:'login',hloc:null,hospital:null,alertAcc:false,tm:null,tk:null};
const API=location.protocol==='file:'?'http://localhost:8000/api':'/api';
const api={wait:(v,ms=900)=>new Promise(r=>setTimeout(()=>r(v),ms)),
async call(path,method,body,fb){let res;try{res=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:body?JSON.stringify(body):undefined})}catch(e){if(location.protocol==='file:'){console.warn('Backend offline, demo mode');return fb}throw new Error('Cannot reach the server. Check your connection and try again.')}
const j=await res.json().catch(()=>({}));if(!res.ok)throw new Error(typeof j.detail==='string'?j.detail:'Request failed ('+res.status+')');return j},
registerDonor:d=>api.call('/donors','POST',{name:d.name.trim(),phone:d.phone,email:d.email,blood_group:d.g,city:d.city,area:d.area,lat:d.lat?+d.lat:null,lng:d.lng?+d.lng:null,availability:d.av,preferred_time:d.t,last_donated:d.last||null,total_donations:parseInt(d.total)||0,consent_emergency:d.c1,consent_medical:d.c2},{id:'LL-D-'+(4200+Math.floor(Math.random()*700))}),
hospitalLogin:async(e,p)=>{const r=await api.call('/hospital/login','POST',{email:e,password:p},{ok:e==='demo@citycare.com'&&p==='hospital123'});if(r&&r.token){S.token=r.token;S.hospital=r.hospital||null}return !!(r&&r.ok)},
createRequest:async r=>{const fb=location.protocol==='file:'?{...r,id:'LL-'+(2042+Math.floor(Math.random()*40))}:null;const [res]=await Promise.all([api.call('/requests','POST',{blood_group:r.g,units:r.units,urgency:r.urg,radius_km:r.radius,context:r.ctx,notes:r.notes||'',required_by:r.by||null,rare_mode:!!r.rare},fb),api.wait(0,2800)]);return res},
respond:async(rid,did,resp)=>{if(typeof rid!=='string'||!rid.startsWith('LL-'))return null;try{return await api.call('/requests/'+rid+'/respond','POST',{donor_id:did,response:resp},null)}catch(e){return null}},
updateStatus:async(id,s)=>{try{return await api.call('/requests/'+id+'/status','PATCH',{status:s},null)}catch(e){return null}},
expand:async(id,radius)=>{try{return await api.call('/requests/'+id+'/expand','POST',{radius_km:radius},null)}catch(e){return null}}};
api.get=async p=>{try{return await api.call(p,'GET',null,null)}catch(e){return null}};
const hname=()=>(S.hospital&&S.hospital.name)||'City Care Hospital';
const urgB=u=>`<span class="badge ${u==='CRITICAL'?'':u==='URGENT'?'a':'g'}">${ic('bolt',12)}${u}</span>`;
const clk=(o=0)=>{const d=new Date(Date.now()-o*6e4);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3800)}
function confirmM(t,b,ok,cls='p'){$('#modal').innerHTML=`<div class="ov" role="dialog" aria-modal="true"><div class="card"><h3>${t}</h3><p class="mut" style="margin:8px 0 18px">${b}</p><div class="row"><button class="btn ${cls} sp" id="mok">Confirm</button><button class="btn sp" id="mno">Go back</button></div></div></div>`;$('#mno').onclick=()=>$('#modal').innerHTML='';$('#mok').onclick=()=>{$('#modal').innerHTML='';ok()};$('#mok').focus()}
const ring=(v,c='#D7263D')=>`<div class="ring"><svg viewBox="0 0 36 36" width="130" height="130"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--bd)" stroke-width="3.500"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="${c}" stroke-width="3.500" stroke-linecap="round" stroke-dasharray="${v*.974} 100" transform="rotate(-90 18 18)"/></svg><b>${v}</b></div>`;

const TT={donor:'Become a Donor','donor-dashboard':'My Donor Dashboard',hospital:'Hospital Portal',dashboard:'Hospital Dashboard',request:'Emergency Blood Request',command:'Emergency Command Center',alert:'Donor Alert',analytics:'Analytics',how:'How It Works'};
const ROUTES=['home','donor','donor-dashboard','hospital','dashboard','request','command','alert','analytics','how'];
function navHTML(r){const L=[['home','Home'],['donor','Become a Donor'],['hospital','Hospital Portal'],['command','Emergency Command Center'],['how','How It Works']];
return `<nav><div class="wrap"><a href="#home" aria-label="LifeLink home">${logo}</a><div class="menu" id="mn">${L.map(l=>`<a href="#${l[0]}" class="${r===l[0]?'on':''}">${l[1]}</a>`).join('')}</div><div class="row nav-cta"><a class="btn sm" href="#donor">Become a Donor</a><a class="btn sm p" href="#request">Hospital Emergency Request</a></div><button class="btn sm burger" id="bg" aria-label="Menu">Menu</button></div></nav>`}

function analytics(){const bars=[['O−',18],['B+',14],['AB−',9],['A+',12],['O+',16],['B−',6],['A−',7],['AB+',4]],mo=[120,150,138,190,220,260],mx=260;
const pts=mo.map((v,i)=>`${30+i*58},${150-v/mx*120}`).join(' '),don=[['Fulfilled',72,'#16A34A'],['Expired',18,'#F59E0B'],['Cancelled',10,'#9CA3AF']];let off=0;
const heat=['Arera','MP Nagar','Kolar','TT Nagar','Bairagarh'].map(a=>`<div style="text-align:left;padding-left:0">${a}</div>`+G.slice(0,4).map((g,i)=>{const v=(a.length*7+i*13)%10;return `<div style="background:rgba(215,38,61,${.12+v/12});color:${v>5?'#fff':'inherit'}">${g} · ${v+2}</div>`}).join('')).join('');
return `<div class="wrap page">${hosTabs('analytics')}<h1 style="font-size:34px;margin-bottom:18px">Analytics <span class="badge x" style="vertical-align:middle">Sample data</span></h1><div class="grid g3" style="margin-bottom:18px"><div class="card kpi"><b>4.8 min</b><span>Average donor response time</span></div><div class="card kpi"><b>71%</b><span>Acceptance rate</span></div><div class="card kpi"><b>72%</b><span>Requests fulfilled</span></div></div>
<div class="grid g2"><div class="card"><h3>Requests by blood group</h3><div style="margin-top:14px;display:grid;gap:8px">${bars.map(b=>`<div class="row" style="gap:10px"><span style="width:34px;font-weight:700">${b[0]}</span><div class="bar sp" style="height:14px"><i style="width:${b[1]/18*100}%"></i></div><b>${b[1]}</b></div>`).join('')}</div></div>
<div class="card"><h3>Fulfilled vs expired</h3><div class="row" style="margin-top:14px;gap:24px"><svg width="140" height="140" viewBox="0 0 36 36">${don.map(d=>{const s=`<circle cx="18" cy="18" r="14" fill="none" stroke="${d[2]}" stroke-width="5" stroke-dasharray="${d[1]*.88} 100" stroke-dashoffset="${-off*.88}" transform="rotate(-90 18 18)"/>`;off+=d[1];return s}).join('')}</svg><div style="display:grid;gap:6px">${don.map(d=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${d[2]};margin-right:8px"></i>${d[0]} ${d[1]}%</span>`).join('')}</div></div></div>
<div class="card"><h3>Monthly donation impact</h3><svg viewBox="0 0 360 170" style="width:100%;margin-top:10px"><polyline points="${pts}" fill="none" stroke="#D7263D" stroke-width="3" stroke-linejoin="round"/>${mo.map((v,i)=>`<circle cx="${30+i*58}" cy="${150-v/mx*120}" r="4" fill="#D7263D"/><text x="${30+i*58}" y="168" font-size="10" text-anchor="middle" fill="currentColor">${['May','Jun','Jul','Aug','Sep','Oct'][i]}</text>`).join('')}</svg><p class="mut" style="font-size:13px">Lives potentially impacted per month (Oct: 260)</p></div>
<div class="card"><h3>Donor availability by area</h3><div class="heat" style="margin-top:14px">${heat}</div></div></div></div>`}

/* ---------- How it works ---------- */
function how(){return `<div class="wrap page" style="max-width:900px"><h1 style="font-size:clamp(30px,4vw,46px)">How LifeLink works</h1><div class="grid g2" style="margin:24px 0"><div class="card"><h3>For donors</h3><p class="mut" style="margin-top:8px">Register once with blood group and area. Set your availability. When a compatible request opens near you, accept in one tap and get directions.</p></div><div class="card"><h3>For hospitals</h3><p class="mut" style="margin-top:8px">Create a request in under 30 seconds. LifeLink ranks donors and alerts the top ones, then you track responses on a live map.</p></div></div>
<h2 style="font-size:26px;margin-bottom:12px">Blood compatibility guide</h2><div class="card sc cmp"><table><tr><th>Patient blood group</th><th>Compatible donor blood groups</th></tr>${G.map(g=>`<tr><td>${gb(g)}</td><td>${COMP[g].map(c=>`<b style="background:${GC[c]}">${c}</b>`).join('')}</td></tr>`).join('')}</table></div>
<h2 style="font-size:26px;margin:30px 0 12px">Donor Readiness Score</h2><div class="card">${[['Distance score',40,'var(--red)'],['Availability score',25,'var(--amb)'],['Eligibility score',20,'var(--grn)'],['Past emergency response',15,'#2563EB']].map(s=>`<div class="row" style="margin-top:10px"><b class="sp">${s[0]}</b><b>/${s[1]}</b></div><div class="bar"><i style="width:${s[1]*2.5}%;background:${s[2]}"></i></div>`).join('')}</div>
<h2 style="font-size:26px;margin:30px 0 12px">Emergency escalation</h2><div class="card"><div class="tl"><div>Top 8 donors within the starting radius are alerted</div><div>Low response expands the radius to 15 km</div><div>Nearby blood banks are notified</div><div>Hospital marks the request fulfilled</div></div></div>
<div class="card" style="margin-top:30px;background:var(--soft)"><h3>${ic('shield',18)} Safety and privacy</h3><p class="mut" style="margin-top:8px">Donor contact details are shared only after a donor accepts. Final medical eligibility is always decided by the hospital or blood bank.</p></div></div>`}

/* ---------- Router ---------- */
function cd(){const els=document.querySelectorAll('[data-cd]');if(!els.length)return;let t=+els[0].dataset.cd;S.tk=setInterval(()=>{t=Math.max(0,t-1);const x=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');els.forEach(e=>e.textContent=x)},1000)}
function route(){let r=location.hash.slice(1)||'home';if(!ROUTES.includes(r))r='home';clearInterval(S.tm);clearInterval(S.tk);$('#modal').innerHTML='';$('#nav').innerHTML=r==='alert'?'':navHTML(r);const b=$('#bg');if(b)b.onclick=()=>$('#mn').classList.toggle('open');
const A=$('#app');const PG={home,donor,'donor-dashboard':donorDash,hospital,dashboard:dash,request,alert:alertPg,analytics,how};document.title=r==='home'?'LifeLink — Emergency Blood Donor Matching Network':(TT[r]||'LifeLink')+' | LifeLink';
if(r==='command'){command()}else A.innerHTML=PG[r]();
if(r==='home')counters();if(r==='donor')donorBind();if(r==='hospital')hospBind();if(r==='dashboard')dashBind();if(r==='request')reqBind();if(r==='alert')alertBind();cd();scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
